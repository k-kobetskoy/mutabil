components:
  schemas:
    AddressDetails:
      additionalProperties: false
      description: "Personal data: never put into share links"
      properties:
        apartment:
          maxLength: 20
          type: string
        block:
          maxLength: 20
          type: string
        number:
          maxLength: 20
          type: string
        stair:
          maxLength: 20
          type: string
        street:
          maxLength: 120
          type: string
      type: object
    AddressRecord:
      additionalProperties: false
      description: Building facts remembered for the next client from the same entrance
      properties:
        confirmedAt:
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        confirmedBy:
          enum:
            - client
            - crew
            - administrator
          type: string
        doorWidthCm:
          maximum: 200
          minimum: 40
          type: integer
        elevator:
          enum:
            - none
            - small
            - medium
            - large
          type: string
        furnitureInLift:
          enum:
            - "yes"
            - "no"
          type: string
        key:
          description: "Normalised: street|number|block|stair (see normalizeAddressKey)"
          maxLength: 200
          type: string
        plateLoadKg:
          maximum: 5000
          minimum: 100
          type: integer
        platePersons:
          maximum: 60
          minimum: 1
          type: integer
        raisedEntrance:
          type: boolean
      required:
        - key
        - confirmedBy
        - confirmedAt
      type: object
    Annotation:
      additionalProperties: false
      description: Vector layer over a photo; coordinates normalised to 0..1
      properties:
        note:
          maxLength: 2000
          type: string
        pins:
          items:
            additionalProperties: false
            properties:
              intent:
                $ref: "#/components/schemas/MarkIntent"
              "n":
                maximum: 99
                minimum: 1
                type: integer
              text:
                maxLength: 500
                type: string
              x:
                format: double
                maximum: 1
                minimum: 0
                type: number
              "y":
                format: double
                maximum: 1
                minimum: 0
                type: number
            required:
              - "n"
              - x
              - "y"
              - text
            type: object
          maxItems: 50
          type: array
        strokes:
          items:
            additionalProperties: false
            properties:
              intent:
                $ref: "#/components/schemas/MarkIntent"
              points:
                items:
                  $ref: "#/components/schemas/Point"
                maxItems: 2000
                type: array
              width:
                format: double
                maximum: 40
                minimum: 1
                type: number
            required:
              - intent
              - width
              - points
            type: object
          maxItems: 200
          type: array
      required:
        - strokes
        - pins
      type: object
    Assumption:
      additionalProperties: false
      properties:
        explain:
          $ref: "#/components/schemas/Explain"
        path:
          type: string
        value:
          $ref: "#/components/schemas/Scalar"
      required:
        - path
        - value
        - explain
      type: object
    Bani:
      description: Money in bani (1 leu = 100 bani), VAT included
      maximum: 9007199254740991
      minimum: -9007199254740991
      type: integer
    CarryChoice:
      description: Distance from the van to the building entrance, metres.
      enum:
        - lt10
        - 10to30
        - gt30
        - unknown
      type: string
    Contact:
      additionalProperties: false
      description: Phone or email is required (checked by the server)
      properties:
        channel:
          enum:
            - phone
            - whatsapp
            - email
          type: string
        email:
          format: email
          maxLength: 120
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        phone:
          maxLength: 30
          type: string
      required:
        - name
      type: object
    CustomItem:
      additionalProperties: false
      properties:
        dCm:
          maximum: 400
          minimum: 1
          type: integer
        hCm:
          maximum: 400
          minimum: 1
          type: integer
        label:
          maxLength: 60
          type: string
        qty:
          maximum: 99
          minimum: 1
          type: integer
        wCm:
          maximum: 400
          minimum: 1
          type: integer
        weightKg:
          maximum: 1000
          minimum: 0
          type: integer
      required:
        - wCm
        - dCm
        - hCm
        - qty
      type: object
    ElevatorChoice:
      description: Elevator class picked by picture. unknown → company clarifies.
      enum:
        - none
        - small
        - medium
        - large
        - unknown
      type: string
    Endpoint:
      additionalProperties: false
      properties:
        carry:
          $ref: "#/components/schemas/CarryChoice"
        elevator:
          $ref: "#/components/schemas/ElevatorChoice"
        floor:
          description: "Romanian count: parter = 0"
          maximum: 30
          minimum: 0
          type: integer
        furnitureInLift:
          $ref: "#/components/schemas/TriState"
          description: Does the building association allow furniture in the lift?
        parking:
          $ref: "#/components/schemas/ParkingChoice"
        raisedEntrance:
          description: Steps at the entrance / half-floor lift stops
          type: boolean
        stairs:
          $ref: "#/components/schemas/StairsChoice"
        zoneId:
          description: Zone id from config/zones.json
          maxLength: 40
          minLength: 1
          type: string
      type: object
    Estimate:
      additionalProperties: false
      properties:
        assumptions:
          items:
            $ref: "#/components/schemas/Assumption"
          type: array
        configVersion:
          type: string
        crew:
          additionalProperties: false
          properties:
            alternatives:
              items:
                additionalProperties: false
                properties:
                  size:
                    maximum: 9007199254740991
                    minimum: -9007199254740991
                    type: integer
                  total:
                    $ref: "#/components/schemas/Bani"
                  windowH:
                    format: double
                    type: number
                required:
                  - size
                  - total
                  - windowH
                type: object
              type: array
            explain:
              $ref: "#/components/schemas/Explain"
            size:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
          required:
            - size
            - alternatives
            - explain
          type: object
        hints:
          items:
            $ref: "#/components/schemas/Explain"
          type: array
        included:
          items:
            type: string
          type: array
        lines:
          items:
            $ref: "#/components/schemas/EstimateLine"
          type: array
        overtime:
          additionalProperties: false
          properties:
            perHour:
              $ref: "#/components/schemas/Bani"
            stepMin:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
          required:
            - perHour
            - stepMin
          type: object
        price:
          additionalProperties: false
          properties:
            afterSurvey:
              additionalProperties: false
              description: "After confirmation: final ≤ confirmed estimate × (1 + capTolerance)"
              properties:
                capTolerance:
                  format: double
                  type: number
                method:
                  enum:
                    - onsite
                    - remote
                  type: string
              required:
                - capTolerance
                - method
              type: object
            base:
              $ref: "#/components/schemas/Bani"
            high:
              $ref: "#/components/schemas/Bani"
            kind:
              description: Until a survey is confirmed the price is always a range
              enum:
                - range
              type: string
            low:
              $ref: "#/components/schemas/Bani"
            reasons:
              description: Why the range is this wide
              items:
                $ref: "#/components/schemas/Explain"
              type: array
            vat:
              $ref: "#/components/schemas/Bani"
            worst:
              $ref: "#/components/schemas/Bani"
              description: Every unknown answer at its worst and max volume
          required:
            - kind
            - base
            - low
            - high
            - worst
            - vat
            - reasons
          type: object
        rulesVersion:
          type: string
        scenarios:
          items:
            $ref: "#/components/schemas/Scenario"
          type: array
        tasks:
          items:
            additionalProperties: false
            properties:
              code:
                type: string
              params:
                additionalProperties:
                  type: string
                propertyNames:
                  type: string
                type: object
            required:
              - code
            type: object
          type: array
        time:
          additionalProperties: false
          properties:
            billedH:
              format: double
              type: number
            breakdown:
              items:
                $ref: "#/components/schemas/Explain"
              type: array
            expectedH:
              format: double
              type: number
            windowH:
              format: double
              type: number
          required:
            - expectedH
            - windowH
            - billedH
            - breakdown
          type: object
        timeline:
          items:
            $ref: "#/components/schemas/TimelineEvent"
          type: array
        vehicle:
          additionalProperties: false
          properties:
            count:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
            explain:
              $ref: "#/components/schemas/Explain"
            fillPct:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
            id:
              type: string
            parkedAway:
              items:
                enum:
                  - from
                  - to
                type: string
              type: array
            trips:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
          required:
            - id
            - count
            - trips
            - fillPct
            - explain
            - parkedAway
          type: object
        volume:
          additionalProperties: false
          properties:
            boxes:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
            high:
              format: double
              type: number
            low:
              format: double
              type: number
            m3:
              format: double
              type: number
            source:
              enum:
                - preset
                - list
                - atSurvey
              type: string
            weightKg:
              maximum: 9007199254740991
              minimum: -9007199254740991
              type: integer
          required:
            - m3
            - low
            - high
            - weightKg
            - source
            - boxes
          type: object
        warnings:
          items:
            $ref: "#/components/schemas/Explain"
          type: array
      required:
        - configVersion
        - rulesVersion
        - price
        - volume
        - vehicle
        - crew
        - time
        - overtime
        - lines
        - included
        - assumptions
        - scenarios
        - tasks
        - warnings
        - hints
        - timeline
      type: object
    EstimateLine:
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/Bani"
        details:
          items:
            $ref: "#/components/schemas/Explain"
          type: array
        explain:
          $ref: "#/components/schemas/Explain"
        id:
          $ref: "#/components/schemas/LineId"
        step:
          description: Step id where the answer behind this line can be changed
          type: string
      required:
        - id
        - amount
        - explain
      type: object
    Explain:
      additionalProperties: false
      description: i18n key + params; texts live in messages/*.json
      properties:
        key:
          type: string
        params:
          additionalProperties:
            $ref: "#/components/schemas/Scalar"
          propertyNames:
            type: string
          type: object
      required:
        - key
      type: object
    LineId:
      enum:
        - transport
        - crew
        - fullDayDiscount
        - weekend
        - dispatch
        - intercity
        - packing
        - materials
        - crates
        - assembly
        - special
        - protection
        - survey
        - surveyCredit
        - minimumOrder
      type: string
    Locale:
      enum:
        - ro
        - en
      type: string
    MarkIntent:
      description: green = we move it, blue = it stays, yellow = careful/fragile/disassemble
      enum:
        - move
        - stay
        - careful
      type: string
    MediaRef:
      additionalProperties: false
      properties:
        annotation:
          $ref: "#/components/schemas/Annotation"
        id:
          maxLength: 64
          type: string
        kind:
          enum:
            - photo
            - video
            - elevatorPlate
            - access
          type: string
      required:
        - id
        - kind
      type: object
    OrderInput:
      additionalProperties: false
      properties:
        assembly:
          additionalProperties: false
          properties:
            disassembleOnMovingDay:
              type: boolean
            items:
              additionalProperties:
                maximum: 99
                minimum: 1
                type: integer
              propertyNames:
                maxLength: 40
                type: string
              type: object
          type: object
        crew:
          description: Client-chosen crew size (alternative)
          maximum: 6
          minimum: 2
          type: integer
        distanceKm:
          description: Only for another city
          maximum: 1500
          minimum: 1
          type: integer
        from:
          $ref: "#/components/schemas/Endpoint"
        inventory:
          additionalProperties: false
          properties:
            boxes:
              description: undefined → typical for the home preset
              maximum: 400
              minimum: 0
              type: integer
            custom:
              items:
                $ref: "#/components/schemas/CustomItem"
              maxItems: 20
              type: array
            items:
              additionalProperties:
                maximum: 99
                minimum: 1
                type: integer
              propertyNames:
                maxLength: 40
                type: string
              type: object
            kallaxInserts:
              maximum: 400
              minimum: 0
              type: integer
            mode:
              enum:
                - preset
                - list
                - atSurvey
              type: string
          required:
            - mode
          type: object
        mode:
          enum:
            - quick
            - detailed
          type: string
        packing:
          additionalProperties: false
          properties:
            containers:
              enum:
                - crates
                - cardboard
                - own
              type: string
            crateDays:
              description: Days the crates stay with the client
              maximum: 60
              minimum: 1
              type: integer
            mattressBagsDouble:
              maximum: 20
              minimum: 0
              type: integer
            mattressBagsSingle:
              maximum: 20
              minimum: 0
              type: integer
            mirrorProtection:
              maximum: 20
              minimum: 0
              type: integer
            tvProtection:
              maximum: 20
              minimum: 0
              type: integer
            wardrobeBoxes:
              maximum: 50
              minimum: 0
              type: integer
            who:
              enum:
                - self
                - partial
                - full
              type: string
          type: object
        protection:
          additionalProperties: false
          properties:
            declaredValueLei:
              maximum: 10000000
              minimum: 0
              type: integer
            deductible:
              type: boolean
            level:
              enum:
                - basic
                - full
              type: string
          required:
            - level
          type: object
        route:
          description: "Quick mode only: rough route when zones are not chosen"
          enum:
            - city
            - suburb
            - intercity
          type: string
        schedule:
          additionalProperties: false
          properties:
            date:
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              type: string
            fullDay:
              type: boolean
            slot:
              enum:
                - morning
                - midday
                - afternoon
              type: string
          type: object
        service:
          description: '"full" = we take care of everything: a specialist visit sets a fixed price (D31). Absent = flexible.'
          enum:
            - flexible
            - full
          type: string
        size:
          additionalProperties: false
          properties:
            amount:
              enum:
                - light
                - normal
                - heavy
              type: string
            presetId:
              maxLength: 40
              type: string
            storage:
              type: boolean
            workstations:
              maximum: 200
              minimum: 1
              type: integer
          type: object
        special:
          items:
            $ref: "#/components/schemas/SpecialItem"
          maxItems: 20
          type: array
        survey:
          additionalProperties: false
          properties:
            method:
              enum:
                - onsite
                - remote
                - none
              type: string
          required:
            - method
          type: object
        taskType:
          $ref: "#/components/schemas/TaskType"
        to:
          $ref: "#/components/schemas/Endpoint"
        v:
          const: 1
          format: double
          type: number
      required:
        - v
        - mode
      type: object
    OrderRequest:
      additionalProperties: false
      properties:
        addresses:
          additionalProperties: false
          properties:
            from:
              $ref: "#/components/schemas/AddressDetails"
            to:
              $ref: "#/components/schemas/AddressDetails"
          type: object
        comment:
          maxLength: 2000
          type: string
        consents:
          additionalProperties: false
          properties:
            estimateTerms:
              const: true
              description: "Acknowledged: before survey the price is a range"
              type: boolean
            marketing:
              type: boolean
          required:
            - estimateTerms
            - marketing
          type: object
        contact:
          $ref: "#/components/schemas/Contact"
        locale:
          $ref: "#/components/schemas/Locale"
        media:
          items:
            $ref: "#/components/schemas/MediaRef"
          maxItems: 30
          type: array
        order:
          $ref: "#/components/schemas/OrderInput"
      required:
        - order
        - contact
        - addresses
        - consents
        - locale
      type: object
    ParkingChoice:
      enum:
        - atEntrance
        - nearby
        - far
        - unknown
      type: string
    Point:
      items:
        format: double
        maximum: 1
        minimum: 0
        type: number
      maxItems: 3
      minItems: 3
      type: array
    Problem:
      additionalProperties: false
      description: RFC 9457 problem details
      properties:
        detail:
          type: string
        errors:
          description: i18n keys, e.g. validation.floor.required
          items:
            additionalProperties: false
            properties:
              key:
                type: string
              path:
                type: string
            required:
              - path
              - key
            type: object
          type: array
        status:
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    Scalar:
      anyOf:
        - type: string
        - format: double
          type: number
        - type: boolean
    Scenario:
      additionalProperties: false
      description: Price for each possible answer of an unknown field (pricing variant B)
      properties:
        assumed:
          $ref: "#/components/schemas/Scalar"
        options:
          items:
            $ref: "#/components/schemas/ScenarioOption"
          type: array
        path:
          type: string
      required:
        - path
        - assumed
        - options
      type: object
    ScenarioOption:
      additionalProperties: false
      properties:
        delta:
          $ref: "#/components/schemas/Bani"
        total:
          $ref: "#/components/schemas/Bani"
        value:
          $ref: "#/components/schemas/Scalar"
      required:
        - value
        - total
        - delta
      type: object
    Slot:
      additionalProperties: false
      properties:
        available:
          type: boolean
        date:
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          type: string
        slot:
          enum:
            - morning
            - midday
            - afternoon
          type: string
        start:
          pattern: ^\d{2}:\d{2}$
          type: string
      required:
        - date
        - slot
        - start
        - available
      type: object
    SpecialItem:
      additionalProperties: false
      properties:
        declaredValueLei:
          maximum: 10000000
          minimum: 0
          type: integer
        kind:
          enum:
            - fragile
            - valuable
            - pristine
            - piano
          type: string
        label:
          maxLength: 60
          type: string
      required:
        - kind
      type: object
    StairsChoice:
      enum:
        - normal
        - narrow
        - winding
        - unknown
      type: string
    SubmitResult:
      additionalProperties: false
      properties:
        estimate:
          $ref: "#/components/schemas/Estimate"
        requestId:
          type: string
        status:
          enum:
            - received
          type: string
        tasks:
          items:
            type: string
          type: array
      required:
        - requestId
        - status
        - tasks
        - estimate
      type: object
    TaskType:
      enum:
        - apartment
        - house
        - items
        - office
      type: string
    TimelineEvent:
      additionalProperties: false
      properties:
        date:
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          type: string
        dayOffset:
          description: Days relative to the moving day
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        kind:
          enum:
            - survey
            - cratesDelivery
            - packing
            - move
            - cratesPickup
          type: string
      required:
        - kind
        - dayOffset
      type: object
    TriState:
      enum:
        - "yes"
        - "no"
        - unknown
      type: string
  securitySchemes:
    staff:
      description: Staff token (crew, estimators). Not used by the public configurator.
      scheme: bearer
      type: http
info:
  description: "Generated from Zod schemas in src/contract. Do not edit by hand: run `pnpm contract:gen`."
  license:
    name: Proprietary
  title: Mutabil moving configurator API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/address-directory/{key}:
    get:
      operationId: getAddressRecord
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRecord"
          description: Known building
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unknown address
      security: []
      summary: Building facts for an address key (elevator class, rules), so the next client does not have to answer
    put:
      operationId: putAddressRecord
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRecord"
        required: true
      responses:
        "204":
          description: Saved
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Staff token required
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Validation error
      security:
        - staff: []
      summary: Save building facts after a survey or a move
  /v1/estimates:
    post:
      operationId: createEstimate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
          description: Estimate
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Validation error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not implemented yet (MVP: the Go pricing service is a stub; see docs/decisions.md D23)"
